[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-backend"
version = "0.1.0"
description = "Eval-first RAG evaluation backend over Anthropic + MCP documentation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

# ---- Package discovery ----
# The importable package is `app`. Installing the project (`pip install -e .`)
# makes `import app...` resolve from anywhere, which is why tests and scripts
# can import cleanly without path hacks.
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---- Linting (ruff) ----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, N: pep8-naming, UP: pyupgrade,
# B: bugbear, A: builtin-shadowing, C4: comprehensions, PT: pytest-style,
# SIM: simplify, RUF: ruff-specific.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

# ---- Formatting (black) ----
[tool.black]
line-length = 100
target-version = ["py311"]

# ---- Type checking (mypy) ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# ---- Tests (pytest) ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
